---
- hosts: splunk
  become: true
  gather_facts: false
  vars:
    splunk_rpm_url: "https://download.splunk.com/products/splunk/releases/10.0.2/linux/splunk-10.0.2-e2d18b4767e9.x86_64.rpm"
    splunk_username: ""  # Set your Splunk download username (if needed)
    splunk_password: ""  # Set your Splunk download password (if needed)
  tasks:
    - name: Bootstrap Python (install python3) using raw
      become: false
      raw: |
        set -e
        if command -v yum >/dev/null 2>&1; then
          # try passwordless sudo first (-n); fall back to direct install to fail fast without prompting
          sudo -n yum install -y python3 || yum install -y python3 || true
        elif command -v apt-get >/dev/null 2>&1; then
          sudo -n apt-get update || true
          sudo -n apt-get install -y python3 || apt-get update && apt-get install -y python3 || true
        fi
      args:
        warn: false

    - name: Wait for Python 3 to be present
      wait_for:
        path: /usr/bin/python3
        state: present
        timeout: 120

    - name: Set Python interpreter to python3 for this host
      set_fact:
        ansible_python_interpreter: /usr/bin/python3

    - name: Gather facts (after Python bootstrap)
      ansible.builtin.setup:

    - name: Gather EC2 instance facts
      ec2_metadata_facts:

    - name: Update system
      yum:
        name: '*'
        state: latest

    - name: Install wget
      yum:
        name: wget
        state: present

    - name: Download Splunk RPM
      get_url:
        url: "{{ splunk_rpm_url }}"
        dest: /tmp/splunk.rpm
        username: "{{ splunk_username }}"
        password: "{{ splunk_password }}"

    - name: Install Splunk
      yum:
        name: /tmp/splunk.rpm
        state: present

    - name: Enable Splunk to start on boot
      command: /opt/splunk/bin/splunk enable boot-start -user splunk

    - name: Start Splunk service
      command: /opt/splunk/bin/splunk start --accept-license --answer-yes --no-prompt
      become_user: splunk
      ignore_errors: true  # In case it's already started