---
- name: Install and Configure Splunk on Ubuntu
  hosts: all
  become: true
  vars:
    splunk_url: "https://download.splunk.com/products/splunk/releases/10.0.2/linux/splunk-10.0.2-e2d18b4767e9-linux-amd64.deb"
    splunk_deb: "/tmp/splunk.deb"

  tasks:
    - name: Download Splunk .deb package
      get_url:
        url: "{{ splunk_url }}"
        dest: "{{ splunk_deb }}"
        mode: '0644'

    - name: Install Splunk package
      apt:
        deb: "{{ splunk_deb }}"
        state: present

    - name: Accept license and start Splunk
      # Splunk requires a one-time license acceptance
      command: "/opt/splunk/bin/splunk start --accept-license --answer-yes --no-prompt"
      args:
        creates: /opt/splunk/etc/splunk.ready  # Prevents re-running if already configured

    - name: Enable Splunk to start on boot
      command: "/opt/splunk/bin/splunk enable boot-start"
      args:
        creates: /etc/systemd/system/splunk.service