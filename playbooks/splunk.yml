and -v yum >/dev/null 2>&1; then
          # try passwordless sudo first (-n); fall back to direct install to fail fast without prompting
          sudo -n yum install -y python3 || yum install -y python3 || true
        elif command -v apt-get >/dev/null 2>&1; then
          sudo -n apt-get update || true
          sudo -n apt-get install -y python3 || apt-get update && apt-get install -y python3 || true
        fi
      args:
